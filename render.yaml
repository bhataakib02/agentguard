services:
  - type: web
    name: agentguard-backend
    env: python
    region: singapore
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --ws-ping-interval 20 --ws-ping-timeout 20
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: PROJECT_NAME
        value: AGENTGUARD
      - key: API_V1_STR
        value: /api
